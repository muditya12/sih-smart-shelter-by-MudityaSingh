<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIH26051 – Shelter Thermal Analyzer</title>
<link rel="stylesheet" href="/static/css/style.css"></head>
<body>
<div class="card">
  <h1>Shelter Thermal Comfort Analyzer</h1>
  <p class="muted">SIH26051 – enter shelter geometry & environment to analyze indoor temperature.</p>
  <form method="post" action="/analyze">
    <fieldset><legend>Climate preset</legend>
      <label>Presets
        <select id="climate" name="climate">
          <option value="">Custom…</option>
          {% for c in climates %}
          <option value ="{{ c.region }}" data-temp="{{c.temp}}" data-irr="{{c.irradiance}}" data-wind="{{c.wind}}">{{c.name}}</option>
          {% endfor %}
        </select>
      </label>
    </fieldset>

    <fieldset><legend>Shelter Geometry (m)</legend>
      <label>Length <input name="length" type="number" step="0.1" value="4" required></label>
      <label>Width  <input name="width"  type="number" step="0.1" value="3" required></label>
      <label>Height <input name="height" type="number" step="0.1" value="2.5" required></label>
      <label>Window area (m²) <input name="window_area" type="number" step="0.1" value="1.5"></label>
    </fieldset>

    <fieldset><legend>Environment</legend>
      <label>Outdoor temp (°C) <input id="t_out" name="outdoor_temp" type="number" step="0.5" value="15" required></label>
      <label>Solar irradiance (W/m²) <input id="irr" name="irradiance" type="number" value="500"></label>
      <label>Sunrise hours <input id="sunrise" name="sunrise" type="number" step="0.5" value="6.0"></label>
      <label>Sunset hours <input id="sunset" name="sunset" type="number" step="0.5" value="18.0"></label>
      <label>Wind speed (m/s) <input id="wind" name="wind_speed" type="number" step="0.1" value="2"></label>
      <label>Air changes/hr <input name="ach" type="number" step="0.1" value="1"></label>
      <label>Simulate hours <input name="hours" type="number" step="0.5" value="6"></label>
    </fieldset>
    <fieldset><legend>Simulation Mode</legend>
      <label style="display:inline-flex; align-items:center; gap:8px;">
        <input type="radio" name="sim_mode" value="single" checked onclick="toggle24h()"> Single Step
      </label>
      <label style="display:inline-flex; align-items:center; gap:8px; margin-left:20px;">
        <input type="radio" name="sim_mode" value="24h" onclick="toggle24h()"> Full 24‑Hour Cycle
      </label>
    </fieldset>

    <fieldset id="diurnal-fields" style="display:none; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap:10px;">
      <legend>24‑Hour Settings</legend>
      <label>Min Outdoor Temp (°C) <input name="min_temp" type="number" step="0.5" value="10"></label>
      <label>Max Outdoor Temp (°C) <input name="max_temp" type="number" step="0.5" value="35"></label>
      <label>Sunrise Hour <input name="sunrise" type="number" step="0.5" value="6.0"></label>
      <label>Sunset Hour <input name="sunset" type="number" step="0.5" value="18.0"></label>
    </fieldset>

    <script>

      function toggle24h() {
        const show = document.querySelector('input[name="sim_mode"]:checked').value === '24h';
        document.getElementById('diurnal-fields').style.display = show ? 'grid' : 'none';

      }
</script>

    <fieldset><legend>Materials & Loads</legend>
      <label>Wall material
        <select name="wall_mat">{% for id,m in materials.items() %}
          <option value="{{id}}">{{m.name}}</option>{% endfor %}</select></label>
      <label>Roof material
        <select name="roof_mat">{% for id,m in materials.items() %}
          <option value="{{id}}">{{m.name}}</option>{% endfor %}</select></label>
      <label>Extra insulation (m)
        <select name="insulation"><option>0</option><option>0.05</option><option>0.1</option></select></label>
      <label>Occupants <input name="occupants" type="number" value="2"></label>
      <label>Equipment (W) <input name="equipment_w" type="number" value="0"></label>
    </fieldset><legend>Temperature Controls (target 25–30 °C)</legend>
    <label>Auto-manage to 25–30 °C
      <select name="auto"><option value="1">yes(recommended)</option><option value="0">no-manul</option></select></label> 
    <label>Shade net / reflective coating
      <select name="shade"><option value="0">no</option><option value="1">yes</option></select></label>
      <option value="1">yes</option></select></label>
    <label>Evaporative cooling
      <input name="evap_kw" type="number" step="0.1" min="0" value="0"></label>
      <label>Heater (kW)
      <input name="heater_kw" type="number" step="0.1" min="0" value="0"></label>
    </fieldset>  
    <button type="submit">Analyze Shelter</button>
  </form>
</div>
<script src="/static/js/app.js"></script>
</body></html>
